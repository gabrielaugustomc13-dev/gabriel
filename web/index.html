rline{font-size:10px;letter-spacing:1.8px;font-weight:700;color:#688050;margin-bottom:13px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:18px;margin-bottom:26px}.card{border:1px solid #e1e6e2;border-radius:12px;background:#fff;padding:23px}.stat strong{display:block;font-size:29px;margin:13px 0}.muted{color:#819087;font-size:12px}.grid{display:grid;grid-template-columns:1.8fr 1fr;gap:22px}.sectionhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:20px}table{width:100%;border-collapse:collapse;text-align:left}th{font-size:10px;letter-spacing:1px;color:#8c9891;font-weight:600;padding:13px 8px;border-bottom:1px solid #e7ece8}td{padding:17px 8px;border-bottom:1px solid #f0f2ef;font-size:13px}.badge{background:#edf3e8;color:#5d7c48;border-radius:5px;padding:5px 9px;font-size:11px}.module{display:flex;align-items:center;justify-content:space-between;padding:16px 0;border-bottom:1px solid #eef0ec}.module small{display:block;color:#859187;margin-top:5px}.switch{width:38px;height:22px;accent-color:#406a45;cursor:pointer}.modulesgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:18px}.field{display:flex;flex-direction:column;gap:8px;margin:17px 0}input,select,textarea{width:100%;padding:12px;background:white;border:1px solid #dce2dc;border-radius:7px;color:#203331}input:focus,select:focus,textarea:focus{outline:2px solid #b4d18e}label{font-size:12px;font-weight:600}.board{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}.column{background:#eaf0e9;border-radius:10px;padding:15px;min-height:320px}.deal{margin-top:15px;padding:17px;background:white;border:1px solid #dfe7db;border-radius:9px}.deal strong{display:block;margin:10px 0}.empty{padding:25px;text-align:center;color:#87958a}.two{display:grid;grid-template-columns:1fr 1fr;gap:20px}dialog{border:0;border-radius:14px;padding:27px;max-width:510px;width:92%;box-shadow:0 20px 70px #0003}dialog::backdrop{background:#102e2b88}.actions{display:flex;justify-content:flex-e </style><link rel="stylesheet" href="workspace.css"></head><body><aside aria-label="Navegação da plataforma"><button type="button" class="brand" aria-label="Voltar à página inicial" title="Voltar à página inicial"><span class="brand-mark" aria-hidden="true"><svg viewBox="0 0 24 24" fill="none"><path d="M5 19V7l7-3 7 3v12l-7 3-7-3Z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/><path d="m5 7 7 4 7-4m-7 4v11" stroke="currentColor" stroke-width="1.6"/></svg></span><span class="brand-word">FLEXÍVEL</span></button><button id="mobileMenu" class="mobile-menu" type="button" aria-label="Menu de navegação" aria-expanded="false"></button><div class="workspace">Meu workspace <span style="float:right">⌄</span><small style="display:block;color:#9caf9e;margin-top:6px">Ambiente de demonstração</small></div><div class="label">NAVEGAÇÃO</div><button class="nav" data-page="overview">◫ &nbsp; Visão geral</button><button class="nav" data-page="clients">♧ &nbsp; Clientes</button><button class="nav" data-page="pipeline">▥ &nbsp; Funil comercial</button><div class="asidefoot">FLEXÍVEL</div></aside><main><header><span class="breadcrumb">Espaço de trabalho <span aria-hidden="true" class="breadcrumb-divider">/</span> <strong id="breadcrumb">Visão geral</strong></span><div class="header-controls"><span class="tag">● Ambiente local</span></div></header><div id="app"></div><div class="notice">Versão de validação • Dados de exemplo e alterações salvos somente neste navegador. Sem sincronização entre usuários ou integração com sistemas externos.</div></main><dialog id="modal"></dialog><div id="toast" hidden class="toast"></div><script src="presentation.js"></script><script>
const uid=()=>globalThis.crypto?.randomUUID?.()||('id-'+Date.now().toString(36)+'-'+Math.random().toString(36).slice(2));const key='flexivel-v1';const stages=['Novo contato','Em atendimento','Proposta enviada','Concluído'];let state;try{state=JSON.parse(localStorage.getItem(key))}catch{};state=state||{company:'Minha empresa',segment:'Serviços',size:'1 a 10 pessoas',needs:'',clients:[{id:'c1',name:'Marina Oliveira',email:'marina@example.com',company:'Aurora Serviços',status:'Ativo',custom:{}},{id:'c2',name:'Rafael Santos',email:'rafael@example.com',company:'Studio Horizonte',status:'Em prospecção',custom:{}},{id:'c3',name:'Camila Costa',email:'camila@example.com',company:'Instituto Jardim',status:'Ativo',custom:{}}],deals:[{id:'d1',name:'Implantação da plataforma',client:'Aurora Serviços',value:4800,stage:2},{id:'d2',name:'Plano de relacionamento',client:'Studio Horizonte',value:2400,stage:1},{id:'d3',name:'Atendimento personalizado',client:'Instituto Jardim',value:3200,stage:0}]};let page='overview';const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const money=v=>Number(v).toLocaleString('pt-BR',{style:'currency',currency:'BRL'});function save(){try{localStorage.setItem(key,JSON.stringify(state))}catch{alert('Não foi possível salvar neste navegador. Exporte seus dados.')}}function toast(t){$('#toast').textContent=t;$('#toast').hidden=false;setTimeout(()=>$('#toast').hidden=true,3000)}function go(p){page=p;render()}function head(title,sub,action=''){return `<div class="heading"><div><h1>${title}</h1><p style="margin:0">${sub}</p></div>${action}</div>`}function btn(t,action,primary=true){return `<button class="btn ${primary?'primary':''}" onclick="${action}">${t}</button>`}function clientRows(list){return list.map(c=>`<tr><td><b>${esc(c.name)}</b><div class="muted" style="margin-top:5px">${esc(c.email)}</div></td><td>${esc(c.company)}</td><td><span class="badge">${esc(c.status)}</span></td><td><button class="link" onclick="clientForm('${c.id}')">Editar</button></td></tr>`).join('')||'<tr><td colspan="4" class="empty">Nenhum cliente encontrado.</td></tr>'}function render(){document.querySelectorAll('.nav').forEach(b=>{b.classList.toggle('active',b.dataset.page===page);b.onclick=()=>go(b.dataset.page);});$('#breadcrumb').textContent=({overview:'Visão geral',clients:'Clientes',pipeline:'Funil comercial'})[page];let html='';if(page==='overview')html=overviewContent();
if(page==='clients'){html=head('Clientes','Cada relacionamento começa com uma boa conversa.',btn('＋ Novo cliente','clientForm()'))+`<div class="card"><input id="search" class="search" placeholder="Buscar por nome, empresa ou e-mail" aria-label="Buscar clientes"><div class="tablewrap"><table><thead><tr><th>NOME E CONTATO</th><th>EMPRESA</th><th>STATUS</th><th>AÇÕES</th></tr></thead><tbody id="rows">${clientRows(state.clients)}</tbody></table></div></div>`}
if(page==='pipeline'){html=head('Funil comercial','Clareza sobre cada oportunidade, do primeiro contato à conclusão.',btn('＋ Nova oportunidade','dealForm()'))+`<div class="board">${stages.map((s,i)=>`<section class="column"><b>${s}</b> <span class="muted">${state.deals.filter(d=>d.stage===i).length}</span><div class="muted" style="margin-top:7px">${money(state.deals.filter(d=>d.stage===i).reduce((a,d)=>a+d.value,0))}</div>${state.deals.filter(d=>d.stage===i).map(d=>`<div class="deal"><span class="muted">${esc(d.client)}</span><strong>${esc(d.name)}</strong><p>${money(d.value)}</p><select aria-label="Etapa de ${esc(d.name)}" onchange="moveDeal('${d.id}',this.value)">${stages.map((s,n)=>`<option value="${n}" ${n===i?'selected':''}>${s}</option>`).join('')}</select><button class="link" onclick="dealForm('${d.id}')">Editar oportunidade</button></div>`).join('')||'<div class="empty">Nenhuma oportunidade</div>'}</section>`).join('')}</div>`}
$('#app').innerHTML=html;if(page==='clients')$('#search').oninput=e=>{$('#rows').innerHTML=clientRows(state.clients.filter(c=>(c.name+' '+c.email+' '+c.company).toLowerCase().includes(e.target.value.toLowerCase())))};}
function openModal(h){$('#modal').innerHTML=h;$('#modal').showModal()}function closeModal(){$('#modal').close()}function footer(){return '<div class="actions"><button type="button" class="btn" onclick="closeModal()">Cancelar</button><button class="btn primary">Salvar</button></div>'}function clientForm(id){const c=state.clients.find(c=>c.id===id)||{name:'',email:'',company:'',status:'Em prospecção',custom:{}};openModal(`<form id="clientform"><h2>${id?'Editar':'Novo'} cliente</h2><label class="field">Nome<input name="name" required maxlength="120" value="${esc(c.name)}"></label><label class="field">E-mail<input name="email" type="email" value="${esc(c.email)}"></label><label class="field">Empresa<input name="company" maxlength="120" value="${esc(c.company)}"></label><label class="field">Status<select name="status">${['Em prospecção','Ativo','Inativo'].map(s=>`<option ${s===c.status?'selected':''}>${s}</option>`).join('')}</select></label>${footer()}</form>`);$('#clientform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={id:id||uid(),name:f.get('name').trim(),email:f.get('email'),company:f.get('company').trim(),status:f.get('status'),custom:{}};if(!v.name)return;if(id)state.clients[state.clients.findIndex(c=>c.id===id)]=v;else state.clients.push(v);save();closeModal();render();toast('Cliente salvo')}}
function dealForm(id){const d=state.deals.find(d=>d.id===id)||{name:'',client:'',value:'',stage:0};openModal(`<form id="dealform"><h2>${id?'Editar':'Nova'} oportunidade</h2><label class="field">Título<input name="name" required maxlength="150" value="${esc(d.name)}"></label><label class="field">Cliente / empresa<input name="client" required maxlength="150" value="${esc(d.client)}"></label><label class="field">Valor (R$)<input name="value" required type="number" step="0.01" min="0" step="0.01" value="${d.value}"></label><label class="field">Etapa<select name="stage">${stages.map((s,i)=>`<option value="${i}" ${d.stage===i?'selected':''}>${s}</option>`).join('')}</select></label>${footer()}</form>`);$('#dealform').onsubmit=e=>{e.preventDefault();const f=new FormData(e.target),v={id:id||uid(),name:f.get('name').trim(),client:f.get('client').trim(),value:Number(f.get('value')),stage:Number(f.get('stage'))};if(!v.name||!v.client)return;if(id)state.deals[state.deals.findIndex(d=>d.id===id)]=v;else state.deals.push(v);save();closeModal();render();toast('Oportunidade salva')}}function moveDeal(id,value){state.deals.find(d=>d.id===id).stage=Number(value);save();render();toast('Etapa atualizada')}function download(name,text,type){const url=URL.createObjectURL(new Blob([text],{type})),a=document.createElement('a');a.href=url;a.download=name;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}function exportData(){download('flexivel-dados.json',JSON.stringify(state,null,2),'application/json')}render();
</script><script src="upgrade.js"></script><script src="pipeline.js"></script><script src="appearance.js"></script><script src="profiles.js"></script><script src="operations-core.js"></script><script src="branding-core.js"></script><script src="native-core.js"></script><script src="operations.js"></script><script src="native-ui.js"></script><script src="native-sync.js"></script><script src="branding.js"></script><script src="whatsapp.js"></script><script src="activity-log.js"></script><script src="whatsapp-attendant.js"></script><script src="pipeline-routes.js"></script><script src="sales-teams.js"></script><script src="excel-templates.js"></script><script src="excel-data.js"></script><script src="excel-xlsx.js"></script><script src="excel-ui.js"></script><script src="deal-outcome.js"></script><script src="pipeline-editor-core.js"></script><script src="pipeline-editor.js"></script><script src="clean-interface.js"></script><script src="access-ui.js"></script><script src="company-core.js"></script><script src="company-editor.js"></script><script src="company-switcher.js"></script><script src="profile-views.js"></script><script src="commercial-user-form.js"></script><script src="lifecycle-core.js"></script><script src="lifecycle-ui.js"></script><script src="customer-operations-ui.js"></script><script src="form-settings-core.js"></script><script src="form-settings-ui.js"></script><script>installCrmPresentation();</script></body></html>
