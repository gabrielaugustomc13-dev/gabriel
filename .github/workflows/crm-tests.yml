name: CRM checks
on:
  push:
    branches: [main, adapt/vercel]
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build
      - run: npm test
      - run: npm run build:vercel
      - run: npm run test:vercel
