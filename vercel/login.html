<!doctype html>
<html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex"><title>Entrar — CRM Flexível</title>
<style>*{box-sizing:border-box}body{margin:0;background:#f5f7f5;color:#153c31;font:16px system-ui;min-height:100vh;display:grid;place-items:center;padding:24px}.panel{background:white;padding:36px;border:1px solid #dce5df;border-radius:16px;width:100%;max-width:430px}h1{font-size:28px;margin:16px 0}p{line-height:1.6;color:#52675c}label{display:block;margin:18px 0;font-weight:600}input,button{font:inherit;width:100%;padding:13px;border:1px solid #b8c8be;border-radius:8px}input{display:block;margin-top:8px}button{background:#153c31;color:white;font-weight:600;cursor:pointer}button:disabled{opacity:.6;cursor:wait}#error{color:#a22e24}small{color:#63766b}.brand{font-weight:800;letter-spacing:.03em}</style></head>
<body><main class="panel"><div class="brand">◈ flexível.</div><h1>Entre no seu CRM</h1><p>Use o login autorizado pelo gestor. Os dados e as permissões são verificados no servidor.</p>
<form id="login"><label>Login<input name="login" autocomplete="username" required maxlength="160"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="error" role="alert" aria-live="polite"></p><button>Entrar</button></form><p><small>Para obter acesso ou redefinir a senha, procure o gestor master.</small></p></main>
<script>
const form=document.querySelector('form'),error=document.querySelector('#error'),button=form.querySelector('button');
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível entrar.');location.replace('/')}catch(e){error.textContent=e.message;button.disabled=false}};
</script></body></html>
