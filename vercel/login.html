<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex"><title>Entrar — FLEXÍVEL</title>
<link rel="stylesheet" href="/workspace.css">
<style>
body{min-height:100vh;display:grid;place-items:center;padding:24px}
.login-shell{width:min(100%,820px);display:grid;grid-template-columns:1fr 1.15fr;overflow:hidden;border:1px solid var(--line);border-radius:20px;background:var(--surface);box-shadow:0 16px 56px #172c651a}
.login-brand{display:flex;flex-direction:column;justify-content:space-between;gap:32px;padding:36px;color:#fff;background:radial-gradient(ellipse at 95% 0,#354d9d 0,transparent 60%),#18243d}
.login-brand strong{font-size:19px;letter-spacing:-.025em}.login-brand span{display:block;font-size:25px;font-weight:700;letter-spacing:-.035em;line-height:1.25}
.login-panel{padding:36px;min-width:0}.login-panel h1{margin:0 0 8px}.login-panel label{display:block;margin:16px 0;font-weight:650}.login-panel input{display:block;width:100%;margin-top:7px;padding:11px;border:1px solid var(--line);border-radius:8px}
.login-panel .btn{width:100%;font:inherit;font-weight:700}.login-panel .btn:disabled{opacity:.65;cursor:wait}#error{color:#a22e24}#error:empty{display:none}
@media(max-width:650px){.login-shell{grid-template-columns:1fr}.login-brand{padding:20px 24px}.login-brand span{display:none}.login-panel{padding:24px}}
</style></head>
<body><div class="login-shell"><div class="login-brand"><strong>FLEXÍVEL</strong><span>Gestão de clientes e operações</span></div>
<main class="login-panel"><h1>Entrar</h1><p>Acesse sua empresa com o login autorizado pelo gestor.</p>
<form id="login"><label>Login<input name="login" autocomplete="username" required maxlength="160"></label><label>Senha<input name="password" type="password" autocomplete="current-password" required maxlength="256"></label><p id="error" role="alert" aria-live="polite"></p><button class="btn primary">Entrar</button></form><p><small>Para obter acesso ou redefinir a senha, procure o gestor master.</small></p></main></div>
<script>
const form=document.querySelector('form'),error=document.querySelector('#error'),button=form.querySelector('button');
form.onsubmit=async event=>{event.preventDefault();button.disabled=true;error.textContent='';try{const response=await fetch('/api/auth/login',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(Object.fromEntries(new FormData(form)))});const data=await response.json();if(!response.ok)throw Error(data.error||'Não foi possível entrar.');location.replace('/')}catch(e){error.textContent=e.message;button.disabled=false}};
</script></body></html>
